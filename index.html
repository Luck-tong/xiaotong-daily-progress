<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="小童的每日研发进展">
  <meta name="theme-color" content="#f4f7fb">
  <title>小童的每日进展</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231a4e8a'/%3E%3Cpath d='M18 17h28v32H18z' fill='white' opacity='.96'/%3E%3Cpath d='M24 26h16M24 33h16M24 40h10' stroke='%231a4e8a' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --ink: #182433;
      --muted: #6d7887;
      --blue: #1a4e8a;
      --blue-soft: #eaf2fb;
      --red: #c9333e;
      --red-soft: #fff0f1;
      --line: #dce4ee;
      --paper: #ffffff;
      --canvas: #f4f7fb;
      --shadow: 0 18px 50px rgba(31, 54, 82, .09);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background:
        radial-gradient(circle at 8% 0%, rgba(49, 112, 179, .09), transparent 26rem),
        linear-gradient(180deg, #f8fafc 0, var(--canvas) 100%);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    button, select, input, textarea { font: inherit; }
    button, select { min-height: 42px; }
    button { cursor: pointer; }

    .page {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
      padding: 64px 0 48px;
    }

    .masthead {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 292px;
      align-items: center;
      gap: 32px;
      margin-bottom: 24px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--blue);
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: "Songti SC", "STSong", serif;
      font-size: clamp(2.25rem, 6vw, 4.35rem);
      font-weight: 700;
      letter-spacing: -.045em;
      line-height: 1;
    }

    .month-card {
      padding: 15px 16px 13px;
      border: 1px solid rgba(201, 213, 226, .9);
      border-radius: 18px;
      background: rgba(255,255,255,.86);
      box-shadow: 0 10px 30px rgba(31, 54, 82, .06);
    }

    .month-title {
      margin: 0 0 9px;
      color: var(--ink);
      font-size: .86rem;
      font-weight: 750;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      text-align: center;
    }

    .calendar-weekday {
      color: #8a94a2;
      font-size: .67rem;
      line-height: 22px;
    }

    .calendar-day {
      position: relative;
      min-height: 27px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #465264;
      font-size: .73rem;
    }

    .calendar-day:hover { background: var(--blue-soft); }
    .calendar-day.worked { background: var(--red-soft); color: var(--red); font-weight: 800; }
    .calendar-day.worked::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 2px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: currentColor;
      transform: translateX(-50%);
    }
    .calendar-day.selected { background: var(--blue); color: #fff; font-weight: 800; }
    .calendar-day.selected.worked::after { background: #fff; }
    .calendar-blank { min-height: 27px; }
    }

    .report {
      overflow: hidden;
      border: 1px solid rgba(201, 213, 226, .9);
      border-radius: 24px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .date-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 13px 18px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfe;
    }

    .date-fields {
      display: flex;
      align-items: center;
      gap: 1px;
    }

    .date-field {
      display: inline-flex;
      align-items: center;
      gap: 1px;
      padding: 0 5px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      transition: background .18s ease, border-color .18s ease;
    }

    .date-field:hover,
    .date-field:focus-within {
      border-color: #cbd8e7;
      background: var(--blue-soft);
    }

    .date-field select {
      appearance: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-weight: 680;
      text-align: center;
    }

    #year { width: 56px; }
    #month, #day { width: 32px; }

    .suffix { color: var(--muted); font-size: .92rem; }

    .weekday {
      margin-left: 4px;
      color: var(--muted);
      font-size: .92rem;
      white-space: nowrap;
    }

    .date-actions {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 15px;
      border: 1px solid #cbd8e7;
      border-radius: 11px;
      background: #fff;
      color: var(--ink);
      font-weight: 650;
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
    }

    .btn:hover { border-color: #9bb5d2; background: #f7fafd; }
    .btn:active { transform: translateY(1px); }
    .btn.primary { border-color: var(--blue); background: var(--blue); color: #fff; }
    .btn.primary:hover { background: #153f70; }

    .content { padding: clamp(24px, 5vw, 48px); }

    .content-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 2px solid var(--ink);
    }

    h2 {
      margin: 0;
      font-family: "Songti SC", "STSong", serif;
      font-size: clamp(1.45rem, 3vw, 2rem);
      line-height: 1.2;
    }

    .summary {
      margin: 0;
      color: var(--muted);
      font-size: .88rem;
      white-space: nowrap;
    }

    .progress-list {
      margin: 0;
      padding: 7px 0 0;
      list-style: none;
      counter-reset: progress;
    }

    .progress-item {
      position: relative;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      gap: 14px;
      align-items: start;
      padding: 22px 0;
      border-bottom: 1px solid var(--line);
      counter-increment: progress;
    }

    .progress-item::before {
      content: counter(progress, decimal-leading-zero);
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border-radius: 10px;
      background: var(--blue-soft);
      color: var(--blue);
      font-size: .8rem;
      font-weight: 800;
    }

    .progress-text {
      margin: 5px 0 0;
      font-size: 1rem;
      line-height: 1.75;
    }

    .delete-button {
      min-height: 32px;
      margin-top: 3px;
      padding: 0 10px;
      border: 1px solid #ead2d5;
      border-radius: 9px;
      background: #fff;
      color: #a72d37;
      font-size: .78rem;
      font-weight: 650;
    }
    .delete-button:hover { background: var(--red-soft); border-color: #dcaab0; }

    .empty {
      display: grid;
      min-height: 300px;
      place-items: center;
      text-align: center;
    }

    .empty[hidden] { display: none; }

    .empty-mark {
      width: 54px;
      height: 54px;
      margin: 0 auto 16px;
      border: 1px dashed #9db0c6;
      border-radius: 16px;
      color: var(--blue);
      font-size: 1.8rem;
      line-height: 50px;
    }

    .empty h3 { margin: 0 0 8px; font-size: 1.05rem; }
    .empty p { margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.7; }

    .source-note {
      margin: 22px 0 0;
      color: #85909e;
      font-size: .78rem;
      line-height: 1.6;
    }

    dialog {
      width: min(520px, calc(100% - 28px));
      padding: 0;
      border: 0;
      border-radius: 20px;
      color: var(--ink);
      box-shadow: 0 30px 80px rgba(16, 35, 58, .24);
    }

    dialog::backdrop { background: rgba(25, 38, 54, .42); backdrop-filter: blur(3px); }
    .dialog-body { padding: 26px; }
    .dialog-title { margin: 0 0 22px; font: 700 1.35rem/1.2 "Songti SC", serif; }
    .form-row { margin-bottom: 16px; }
    .form-row label { display: block; margin-bottom: 7px; font-size: .88rem; font-weight: 700; }
    .form-row input, .form-row textarea, .form-row select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #cbd8e7;
      border-radius: 10px;
      outline: 0;
      background: #fff;
      color: var(--ink);
    }
    .form-row textarea { min-height: 112px; resize: vertical; line-height: 1.6; }
    .form-row input:focus, .form-row textarea:focus, .form-row select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(26,78,138,.1); }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 9px; padding-top: 6px; }
    .password-error { min-height: 20px; margin: -5px 0 7px; color: var(--red); font-size: .82rem; }
    .dialog-note { margin: -10px 0 18px; color: var(--muted); font-size: .82rem; line-height: 1.6; }

    @media (max-width: 680px) {
      .page { width: min(100% - 20px, 960px); padding: 34px 0 24px; }
      .masthead { grid-template-columns: 1fr; gap: 18px; }
      .month-card { width: 100%; }
      .report { border-radius: 18px; }
      .date-bar { align-items: flex-start; flex-wrap: wrap; padding: 14px; }
      .date-fields { width: 100%; justify-content: space-between; }
      .date-actions { margin-left: 0; }
      .weekday { margin-left: auto; align-self: center; }
      .content { padding: 22px 18px; }
      .content-head { align-items: flex-start; flex-direction: column; gap: 6px; }
      .progress-item { grid-template-columns: 38px minmax(0, 1fr); gap: 10px; }
      .delete-button { grid-column: 2; justify-self: start; }
      .summary { white-space: normal; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <div>
        <p class="eyebrow">Research &amp; Development Log</p>
        <h1>小童的每日进展</h1>
      </div>
      <aside class="month-card" aria-label="月度工作日历">
        <p class="month-title" id="monthTitle"></p>
        <div class="calendar-grid" id="calendarGrid"></div>
      </aside>
    </header>

    <section class="report" aria-labelledby="daily-title">
      <div class="date-bar" aria-label="日期选择">
        <div class="date-fields">
          <label class="date-field"><select id="year" aria-label="选择年份"></select><span class="suffix">年</span></label>
          <label class="date-field"><select id="month" aria-label="选择月份"></select><span class="suffix">月</span></label>
          <label class="date-field"><select id="day" aria-label="选择日期"></select><span class="suffix">日</span></label>
        </div>
        <span class="weekday" id="weekday"></span>
        <div class="date-actions">
          <button class="btn" id="todayButton" type="button">今天</button>
          <button class="btn primary" id="addButton" type="button" aria-haspopup="dialog">＋ 添加</button>
        </div>
      </div>

      <div class="content">
        <div class="content-head">
          <h2 id="daily-title">研发进展</h2>
          <p class="summary" id="summary"></p>
        </div>
        <ol class="progress-list" id="progressList"></ol>
        <div class="empty" id="emptyState" hidden>
          <div>
            <div class="empty-mark" aria-hidden="true">＋</div>
            <h3>当天暂无已归档进展</h3>
          </div>
        </div>
      </div>
    </section>
  </main>

  <dialog id="addDialog" aria-labelledby="dialogTitle">
    <form method="dialog" id="addForm">
      <div class="dialog-body">
        <h2 class="dialog-title" id="dialogTitle">添加研发进展</h2>
        <div class="form-row">
          <label for="entryDate">日期</label>
          <input id="entryDate" name="entryDate" type="date" required>
        </div>
        <div class="form-row">
          <label for="entryText">进展内容</label>
          <textarea id="entryText" name="entryText" placeholder="例如：修复了合同对照页面的布局问题" required></textarea>
        </div>
        <div class="dialog-actions">
          <button class="btn" value="cancel" type="button" id="cancelButton">取消</button>
          <button class="btn primary" value="default" type="submit">保存</button>
        </div>
      </div>
    </form>
  </dialog>

  <dialog id="unlockDialog" aria-labelledby="unlockTitle">
    <form method="dialog" id="unlockForm">
      <div class="dialog-body">
        <h2 class="dialog-title" id="unlockTitle">验证编辑密码</h2>
        <p class="dialog-note">验证后可在本次打开页面期间添加或删除进展。</p>
        <div class="form-row">
          <label for="editPassword">密码</label>
          <input id="editPassword" name="editPassword" type="password" inputmode="numeric" autocomplete="current-password" required>
        </div>
        <p class="password-error" id="passwordError" role="alert"></p>
        <div class="dialog-actions">
          <button class="btn" type="button" id="cancelUnlock">取消</button>
          <button class="btn primary" type="submit">确认</button>
        </div>
      </div>
    </form>
  </dialog>
